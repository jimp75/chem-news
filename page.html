function feedHTML(items) {

}

function newsUrl(q, when) {

function liveHTML(q) {

}

let filter = "All";
let current = "latest";
function render(view) {
  current = view;
  const co = COMPANIES.find(c => c.id === view);
  let html = "";
  if (co) {
    const saved = (latest && latest.sections && latest.sections[co.id]) || [];
    const rest = sorted.filter(n => n.co === co.id && !saved.some(x => x.url === n.u));
    html = `<div class="head"><div class="hd">${logo(co, true)}<h2>${esc(co.name)}</h2></div><p>${esc(co.lede)}</p><div class="links">${co.links.map(l => `<a class="btn" href="${esc(l[1])}" ${ext}>${esc(l[0])}</a>`).join("")}${co.custom ? '<input id="rm-pw" type="password" aria-label="Admin password" placeholder="Admin password"><button class="btn" id="rm-co" type="button">Remove from menu</button><span class="note" id="rm-msg"></span>' : ""}</div></div>`;
    if (co.stats.length) html += `<div class="stats">${co.stats.map(s => `<div class="stat"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div>`;
    html += `${rest.length ? `<section class="sec"><h3>${saved.length ? "Earlier updates" : "Recent updates"}</h3>${feedHTML(rest)}</section>` : saved.length ? "" : `<p class="note">${co.custom ? "No news found yet. Press Refresh, or use the search below." : "No dated 2026 news found in this check. Use the links above or search below."}</p>`}` + liveHTML(co.q);
  } else if (view === "trends") {
    html = `<div class="head"><h2>Major trends</h2><p>Six themes behind this quarter's news. Each one links to its source.</p></div>
    <div class="trends">${TRENDS.map(t => `<article class="trend"><h3>${esc(t.h)}</h3><p>${esc(t.p)}</p><p class="ev">${esc(t.e)} <a href="${esc(t.u)}" ${ext}>${esc(t.src)}</a></p></article>`).join("")}</div>` + liveHTML(LIVE_DEFAULT.trends);
  } else if (view === "press") {
    html = `<div class="head"><h2>Trade press and outlooks</h2><p>Direct links to the publications and bodies that cover the sector.</p></div>` +
      PRESS.map(g => `<section class="sec"><h3>${esc(g[0])}</h3><div class="dir">${g[1].map(l => `<a href="${esc(l[1])}" ${ext}>${esc(l[0])}<span>${esc(l[2])}</span></a>`).join("")}</div></section>`).join("");
  } else {
    const kinds = ["All", "Results", "Deal", "Distribution", "Sector", "Company"];
    const items = filter === "All" ? sorted : sorted.filter(n => n.kind === filter);
    html = `<div class="head"><h2>Latest updates</h2><p>Major stories across manufacturers, distributors and the wider sector. ≈ marks an approximate date.</p></div>
    <section class="sec"><h3>Briefing archive</h3><div class="chips" role="group" aria-label="Filter by type">${kinds.map(k => `<button class="chip" data-k="${k}" aria-pressed="${k === filter}">${k === "Deal" ? "Deals" : k === "Company" ? "Company news" : k === "Distribution" ? "Distributors" : k}</button>`).join("")}</div></section>${feedHTML(items)}` + liveHTML(LIVE_DEFAULT.latest);
  }
  $("view").innerHTML = html;
  document.querySelectorAll("[data-v]").forEach(b => b.dataset.v === view ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  document.querySelectorAll(".cat").forEach(w => w.classList.toggle("on", !!w.querySelector('[aria-current="page"]')));
  const rm = $("rm-co");
  if (rm) rm.onclick = () => removeCompany(co.id);
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => { filter = c.dataset.k; render("latest"); });
  const f = $("live-form");
  if (f) {
    const link = () => { $("live-go").href = newsUrl($("live-q").value.trim() || "chemical industry", $("live-tbs").value); };
    f.oninput = link; f.onchange = link; f.onsubmit = e => { e.preventDefault(); $("live-go").click(); };
  }

}

function clean(s) {
  return String(s || "").replace(/!?\[[^\]]*\]\([^)]*\)/g, " ").replace(/[|#*_`\\]+/g, " ").replace(/-{2,}/g, " ").replace(/\s+/g, " ").trim().slice(0, 220);
}

/* news.json is published with the page and updated by a scheduled task, so every visitor gets the same news. */
let latest = null;
function showFresh(v) {
  const old = $("fresh"); if (old) old.remove();
  const key = COMPANIES.some(c => c.id === v) ? v : v === "latest" ? "latest" : "";
  const list = latest && latest.sections && latest.sections[key];
  const safe = Array.isArray(list) ? list.filter(x => /^https?:\/\//.test(x.url || "")) : [];
  if (!safe.length) return;
  const s = document.createElement("section"); s.id = "fresh"; s.className = "sec";
  const h = document.createElement("h3"); h.textContent = "Latest news"; s.append(h);
  const ul = document.createElement("ul"); ul.className = "feed";
  for (const x of safe) {
    const row = document.createElement("li");
    const d = document.createElement("span"); d.className = "d"; d.textContent = x.date || "";
    const body = document.createElement("div");
    const a = document.createElement("a"); a.className = "t"; a.href = x.url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = clean(x.title) || x.url;
    const src = document.createElement("span"); src.className = "src"; try { src.textContent = x.source || new URL(x.url).hostname.replace(/^www\./, ""); } catch (_) {}
    body.append(a, src);
    const t = clean(x.summary);
    if (t) { const p = document.createElement("p"); p.textContent = t; body.append(p); }
    row.append(d, body); ul.append(row);
  }
  s.append(ul);
  ($("view").querySelector(".stats") || $("view").querySelector(".head")).after(s);
}
function renderTicker() {
  const fresh = latest && latest.sections && latest.sections.latest;
  const items = (Array.isArray(fresh) && fresh.length ? fresh : sorted.slice(0, 10).map(n => ({ title: n.t, url: n.u, date: fmt(n) })))
    .filter(x => /^https?:\/\//.test(x.url || "")).slice(0, 12);
  const t = $("ticker"); t.textContent = "";
  for (const copy of [false, true]) for (const x of items) {
    const a = document.createElement("a"); a.className = "titem"; a.href = x.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    if (copy) { a.setAttribute("aria-hidden", "true"); a.tabIndex = -1; }
    const d = document.createElement("small"); d.textContent = x.date || "";
    const h = document.createElement("span"); h.textContent = clean(x.title);
    a.append(d, h); t.append(a);
  }
  t.style.setProperty("--tick-time", Math.max(60, items.length * 12) + "s");
}
